{% extends "base.html" %}

{% block title %}Recuperar senha — Tubify{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="card sm:p-8">
        <h1 class="mb-1 text-2xl font-bold text-gray-900 dark:text-white">Recuperar senha</h1>
        <p class="mb-6 text-sm text-gray-500 dark:text-slate-400">Informe o email da sua conta para receber instruções de redefinição.</p>

        {% if message %}<div class="alert-success mb-4">{{ message }}</div>{% endif %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="email" class="label">Email</label>
                <input id="email" name="email" type="email" required class="input">
            </div>
            <button type="submit" class="btn-primary btn-block">Enviar instruções</button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500 dark:text-slate-400">
            <a href="{{ url_for('login') }}" class="font-medium text-tubify-green hover:text-green-700">Voltar para o login</a>
        </div>
    </div>
</div>
{% endblock %}
