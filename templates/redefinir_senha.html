{% extends "base.html" %}

{% block title %}Redefinir senha — Tubify{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16 sm:px-6 lg:px-8">
    <div class="card sm:p-8">
        <h1 class="mb-1 text-2xl font-bold text-gray-900 dark:text-white">Redefinir senha</h1>

        {% if invalid %}
        <div class="alert-error mt-4">{{ invalid }}</div>
        <a href="{{ url_for('recuperar_senha') }}" class="mt-6 inline-flex text-sm font-medium text-tubify-green hover:text-green-700">Solicitar novo link</a>
        {% else %}
        <p class="mb-6 text-sm text-gray-500 dark:text-slate-400">Escolha uma nova senha para sua conta.</p>

        {% if error %}<div class="alert-error mb-4">{{ error }}</div>{% endif %}

        <form method="POST" action="{{ url_for('redefinir_senha', token=token) }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="password" class="label">Nova senha</label>
                <input id="password" name="password" type="password" required class="input">
            </div>
            <div>
                <label for="confirm_password" class="label">Confirmar nova senha</label>
                <input id="confirm_password" name="confirm_password" type="password" required class="input">
            </div>
            <button type="submit" class="btn-primary btn-block">Redefinir senha</button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
